<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Uw advertentie is verkocht op bpost</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f2f4f5; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        td, a, span { border-collapse: collapse; }
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; display: block; }
        .brand { color: #d51b23; font-size:24px; font-weight:bold; letter-spacing:-0.5px; text-decoration:none; }
        .cta { background:#d51b23; color:#ffffff; padding:15px 40px; text-decoration:none; border-radius:40px; font-weight:600; font-size:16px; display:inline-block; border:1px solid #b2171b; }
        .cta:hover { opacity:0.95; }
        .accent { color: #d51b23; }
        .muted { color:#5f5f5f; }
        .panel { background:#f8f8f8; border-radius:12px; }
    </style>
</head>
<body style="margin:0; padding:0; background:#f2f4f5; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">
<center style="background-color:#f2f4f5; width:100%; table-layout:fixed;">
    <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#f2f4f5; margin:0 auto;" bgcolor="#f2f4f5">
        <tr>
            <td align="center" valign="top" style="padding:20px 0; background:#f2f4f5;" bgcolor="#f2f4f5">
                <table width="100%" border="0" cellpadding="0" cellspacing="0" style="width:100%; background-color:#ffffff;" bgcolor="#ffffff">
                    <tr>
                        <td style="padding:20px; border-bottom:1px solid #e0e0e0;" bgcolor="#ffffff">
                            <table width="100%" border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="left" valign="middle">
                                        <a href="https://www.bpost.be/nl" target="_blank" style="display:inline-block; text-decoration:none; padding-left:6px;">
                                            <img src="https://www.bpost.be/sites/default/files/bpost_logo_endorsed_RVB_001A.png" alt="bpost" style="height:auto; width:150px; max-width:100%; display:block; border:0;" width="150" height="79">
                                        </a>
                                    </td>
                                    <td align="right" valign="middle">
                                        <a href="#" style="color:#d51b23; text-decoration:underline; font-size:13px;">Mijn advertenties</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:40px 20px 20px; text-align:center;" bgcolor="#ffffff" align="center">
                            <h2 style="color:#0b2a4a; margin:0 0 10px; font-size:24px; line-height:1.3; font-weight:600;">Uw advertentie is verkocht</h2>
                            <p style="color:#5f6b75; line-height:1.5; margin:0 auto 20px; max-width:460px; font-size:16px;">
                                Het artikel <strong class="accent">{{ITEM_TITLE}}</strong> is gekocht. Rond nu de verzending af.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 20px 20px;" bgcolor="#ffffff">
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" class="panel" style="background:#f8f8f8; border-radius:12px; width:100%;" bgcolor="#f8f8f8">
                                <tr>
                                    <td style="padding:22px;" bgcolor="#f8f8f8">
                                        <table width="100%" border="0" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td valign="top" style="color:#5f5f5f; font-size:15px; line-height:1.5;">
                                                    <p style="margin:0 0 8px; color:#5f5f5f; font-size:15px;">Bedrag: <strong class="accent">{{PRICE}}</strong></p>
                                                    <p style="margin:0; color:#5f5f5f; font-size:15px;">E-mail koper: <strong class="accent">{{SELLER_EMAIL}}</strong></p>
                                                </td>
                                                <td valign="top" align="right" style="width:140px; padding-left:12px;">
                                                    <img src="{{IMAGE_URL}}" alt="Product" width="128" style="border-radius:8px; border:1px solid #e0e0e0;">
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:10px 20px 35px; text-align:center;" bgcolor="#ffffff" align="center">
                            <a href="{{LINK}}" target="_blank" rel="noopener" class="cta">Verzendgegevens</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</center>
</body>
</html>
